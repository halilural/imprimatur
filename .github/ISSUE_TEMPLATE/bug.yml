name: Bug
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes: { label: What happened }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What was expected }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: How to reproduce, description: "1., 2., 3.: one action per step" }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Version / environment }
  - type: input
    id: epic
    attributes: { label: Epic, placeholder: "Part of #2" }
    validations: { required: true }
